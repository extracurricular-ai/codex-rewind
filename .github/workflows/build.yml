name: build

# Builds the release binaries, and optionally publishes them to npm.
#
# It never runs on a branch push or a pull request — verification lives in
# blocking-ci, and a build here is something you ask for. Selecting a subset of
# platforms is about wall-clock time rather than cost: a cold release build of
# this workspace is 1,386 crates with full optimisation.

on:
  # A release tag builds all six platforms and attaches them to that tag's
  # release. It does *not* publish to npm: a version cannot be republished, so
  # that step stays an explicit, separately-triggered decision made after
  # looking at what was built. The pattern is narrow so a stray tag cannot
  # start a six-platform matrix by accident.
  push:
    tags:
      - "v*-rewind.*"

  # And a manual run for everything else, where you pick the platforms.
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated: linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64 — or 'all'"
        required: true
        default: "linux-x64,linux-arm64"
      release_tag:
        description: "Attach the binaries to this release tag (created as a draft if absent). Leave blank to only keep them as run artifacts."
        required: false
        default: ""
      publish:
        description: "Publish to npm. Requires all six platforms, so it is ignored unless targets=all."
        type: boolean
        required: false
        default: false
      dry_run:
        description: "With publish: pack and validate, but do not upload to npm."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      publish: ${{ steps.plan.outputs.publish }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        shell: python
        env:
          # Read through the environment rather than interpolating into the
          # script body: a tag name is attacker-influenced text, and pasting it
          # into source would let it end the string it lands in.
          EVENT: ${{ github.event_name }}
          RAW_TARGETS: ${{ inputs.targets }}
          RAW_TAG: ${{ inputs.release_tag }}
          RAW_PUBLISH: ${{ inputs.publish }}
          RAW_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import json, os

          ALL = {
              "linux-x64":    {"triple": "x86_64-unknown-linux-musl",  "runner": "ubuntu-24.04"},
              "linux-arm64":  {"triple": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm"},
              "darwin-x64":   {"triple": "x86_64-apple-darwin",        "runner": "macos-15"},
              "darwin-arm64": {"triple": "aarch64-apple-darwin",       "runner": "macos-15"},
              "win32-x64":    {"triple": "x86_64-pc-windows-msvc",     "runner": "windows-2025"},
              "win32-arm64":  {"triple": "aarch64-pc-windows-msvc",    "runner": "windows-11-arm"},
          }

          on_tag = os.environ["EVENT"] == "push"

          # A tag is a release: build everything, and attach to the tag itself.
          if on_tag:
              names = list(ALL)
              tag = os.environ["REF_NAME"]
          else:
              raw = os.environ.get("RAW_TARGETS", "").strip()
              names = list(ALL) if raw == "all" else [t.strip() for t in raw.split(",") if t.strip()]
              tag = os.environ.get("RAW_TAG", "").strip()

          unknown = [n for n in names if n not in ALL]
          if unknown:
              raise SystemExit(f"unknown target(s): {', '.join(unknown)}. Known: {', '.join(ALL)}")
          if not names:
              raise SystemExit("no targets selected")

          # Publishing needs all six: the launcher's optionalDependencies name
          # every platform by exact version, so a partial set ships a package
          # that cannot install anywhere it did not build. And npm will not let
          # a version be replaced, so the fix would be a version bump.
          publish = (not on_tag) and os.environ.get("RAW_PUBLISH") == "true"
          if publish and set(names) != set(ALL):
              raise SystemExit("publish needs targets=all — a partial set would ship a broken launcher")

          version = tag[1:] if tag.startswith("v") else tag
          if publish and not version:
              raise SystemExit("publish needs release_tag — that is where the npm version comes from")

          include = [{"name": n, **ALL[n]} for n in names]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps({'include': include})}\n")
              fh.write(f"release_tag={tag}\n")
              fh.write(f"publish={str(publish).lower()}\n")
              fh.write(f"dry_run={os.environ.get('RAW_DRY_RUN', 'true')}\n")
              fh.write(f"version={version}\n")
          print(f"building: {', '.join(names)}")
          print(f"release tag: {tag or '(artifacts only)'}")
          if publish:
              print(f"publishing {version}, dry_run={os.environ.get('RAW_DRY_RUN', 'true')}")

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # From inside `codex-rs`, so `rust-toolchain.toml` applies and the target
      # lands on the pinned toolchain. Run at the repository root it installs
      # against the runner's default toolchain instead, and the build then
      # fails with "can't find crate for `core`" — which reads like a missing
      # target rather than a target on the wrong toolchain.
      - name: Install the Rust target
        working-directory: codex-rs
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.triple }}
          rustup target list --installed

      # The Linux packages target musl so the binary runs on any distribution
      # without a glibc version to match.
      - name: Install musl tooling
        if: startsWith(matrix.name, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: ${{ matrix.triple }}

      - name: Build
        working-directory: codex-rs
        run: cargo build --release --bin codexr --target ${{ matrix.triple }}

      # Laid out as the npm packaging script expects to find it, so the tarball
      # step can point `--vendor-src` straight at the downloaded artifacts.
      # `vendor/<triple>/bin/codexr` is not an arbitrary layout: it is where
      # `bin/codex.js` looks, and `--vendor-src` copies these directories
      # through verbatim. Staging it flat here would produce a package that
      # installs cleanly and then cannot find its own binary.
      - name: Stage
        shell: bash
        run: |
          dest="vendor/${{ matrix.triple }}/bin"
          mkdir -p "$dest"
          if [[ "${{ matrix.name }}" == win32-* ]]; then
            cp "codex-rs/target/${{ matrix.triple }}/release/codexr.exe" "$dest/"
          else
            cp "codex-rs/target/${{ matrix.triple }}/release/codexr" "$dest/"
            chmod +x "$dest/codexr"
          fi
          tar -czf "codexr-${{ matrix.triple }}.tar.gz" -C vendor "${{ matrix.triple }}"

      - uses: actions/upload-artifact@v4
        with:
          name: codexr-${{ matrix.triple }}
          path: codexr-${{ matrix.triple }}.tar.gz
          retention-days: 14

      - name: Attach to release
        if: needs.plan.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release_tag }}
          TRIPLE: ${{ matrix.triple }}
        shell: bash
        run: |
          # Created as a draft either way, so a matrix that fails halfway never
          # looks like a finished release. On a manual run the draft also keeps
          # the tag off the repository until you publish, which means a
          # `-rewind.<n>` tag only ever names something that was really built.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes "Built by the build workflow."
          gh release upload "$TAG" "codexr-$TRIPLE.tar.gz" --clobber

  publish:
    name: Publish to npm
    needs: [plan, build]
    # `needs` already fails this job if any platform failed. The condition adds
    # the other half: publishing a partial set would leave the launcher pointing
    # at versions that do not exist, and npm has no clean way back.
    if: |
      needs.plan.outputs.publish == 'true' &&
      !failure() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rebuild the vendor tree
        shell: bash
        run: |
          mkdir -p vendor
          find artifacts -name '*.tar.gz' -exec tar -xzf {} -C vendor \;
          echo "vendor tree:"
          find vendor -type f | sort

      # Every one of these publishes the *same* npm package name. The six
      # platform builds are distinguished by a version suffix and kept off the
      # `latest` tag, because `latest` is what a bare `npm install` follows —
      # point it at a platform build and every other platform installs a
      # package with no binary it can run. The launcher goes last and takes
      # `latest`, since its optionalDependencies name the six by exact version.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" != "true" && -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings → Secrets → Actions," \
                 "or run with dry_run enabled." >&2
            exit 1
          fi

          publish() {  # <staged tarball> [dist-tag]
            local tarball="$1" tag="${2:-}"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "would publish: $tarball ${tag:+--tag $tag}"
              npm publish "$tarball" --dry-run ${tag:+--tag "$tag"}
            else
              npm publish "$tarball" ${tag:+--tag "$tag"}
            fi
          }

          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            python3 codex-cli/scripts/build_npm_package.py \
              --package "codex-$pkg" --version "$VERSION" \
              --vendor-src vendor --pack-output "/tmp/$pkg.tgz"
            publish "/tmp/$pkg.tgz" "$pkg"
          done

          # Last, and only once all six resolve.
          python3 codex-cli/scripts/build_npm_package.py \
            --package codex --version "$VERSION" --pack-output /tmp/launcher.tgz
          publish /tmp/launcher.tgz
