name: build

# Builds the release binaries. It does not publish — release.yml does that,
# and it calls this workflow to do the building.
#
# Selecting a subset of platforms is about wall-clock time rather than cost: a
# cold release build of this workspace is 1,386 crates with full optimisation.

on:
  # Manual only. This is the route for "does it build, and does the binary
  # work" — it never publishes, so verifying something by hand can never
  # become a release by accident.
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated: linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64 — or 'all'"
        required: true
        default: "all"
      release_tag:
        description: "Attach the binaries to this release tag as a draft. Leave blank to keep them as run artifacts only."
        required: false
        default: ""

  # Called by release.yml, which supplies the tag it is building.
  workflow_call:
    inputs:
      targets:
        type: string
        required: true
      release_tag:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    name: Plan targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - id: plan
        shell: python
        env:
          # Read through the environment rather than interpolating into the
          # script body: a tag name is attacker-influenced text, and pasting it
          # into source would let it end the string it lands in.
          RAW_TARGETS: ${{ inputs.targets }}
          RAW_TAG: ${{ inputs.release_tag }}
        run: |
          import json, os

          ALL = {
              "linux-x64":    {"triple": "x86_64-unknown-linux-musl",  "runner": "ubuntu-24.04"},
              "linux-arm64":  {"triple": "aarch64-unknown-linux-musl", "runner": "ubuntu-24.04-arm"},
              "darwin-x64":   {"triple": "x86_64-apple-darwin",        "runner": "macos-15"},
              "darwin-arm64": {"triple": "aarch64-apple-darwin",       "runner": "macos-15"},
              "win32-x64":    {"triple": "x86_64-pc-windows-msvc",     "runner": "windows-2025"},
              "win32-arm64":  {"triple": "aarch64-pc-windows-msvc",    "runner": "windows-11-arm"},
          }

          raw = os.environ.get("RAW_TARGETS", "").strip()
          names = list(ALL) if raw == "all" else [t.strip() for t in raw.split(",") if t.strip()]
          tag = os.environ.get("RAW_TAG", "").strip()

          unknown = [n for n in names if n not in ALL]
          if unknown:
              raise SystemExit(f"unknown target(s): {', '.join(unknown)}. Known: {', '.join(ALL)}")
          if not names:
              raise SystemExit("no targets selected")

          include = [{"name": n, **ALL[n]} for n in names]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps({'include': include})}\n")
              fh.write(f"release_tag={tag}\n")
          print(f"building: {', '.join(names)}")
          print(f"release tag: {tag or '(artifacts only)'}")

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A cold build is 1,386 crates at full optimisation, and any change to
    # Cargo.lock — an upstream merge, say — invalidates the dependency cache and
    # makes the next run cold again. 90 minutes was not enough for darwin-x64
    # after merging rust-v0.147.0, and a timed-out job never reaches the cache's
    # save step, so a too-tight limit makes every subsequent run cold as well.
    # Raised from 200 when packaging started building the rest of the package's
    # binaries (`codex-code-mode-host`, and `bwrap` or the two Windows helpers).
    timeout-minutes: 260
    # Job-level rather than step-level because both cargo invocations below —
    # the entrypoint build, and the one the package builder runs — must agree.
    # `CARGO_PROFILE_*` is part of the fingerprint, so a step that sets it and a
    # step that does not would rebuild all 1,386 crates against each other.
    env:
      # No debug info. The workspace release profile asks for
      # `debug = "line-tables-only"` with `split-debuginfo = "off"`, which puts
      # it inside the binary — and the Stage step below strips it straight back
      # out. Generating and linking it is work whose only result is thrown away,
      # and `split-debuginfo = "off"` makes it the linker's problem on every
      # platform. Overridden here rather than in the profile so a local
      # `cargo build --release` still produces something debuggable.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # From inside `codex-rs`, so `rust-toolchain.toml` applies and the target
      # lands on the pinned toolchain. Run at the repository root it installs
      # against the runner's default toolchain instead, and the build then
      # fails with "can't find crate for `core`" — which reads like a missing
      # target rather than a target on the wrong toolchain.
      - name: Install the Rust target
        working-directory: codex-rs
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.triple }}
          rustup target list --installed

      # The Linux packages target musl so the binary runs on any distribution
      # without a glibc version to match.
      #
      # `libcap-dev` is for `bwrap`, which the packaging step below builds:
      # `codex-rs/bwrap/build.rs` probes libcap through pkg-config and panics
      # without it. The host's headers are correct even for the musl targets —
      # that build script passes them as `-idirafter` precisely so the target
      # sysroot wins during a musl cross build.
      - name: Install musl tooling
        if: startsWith(matrix.name, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools libcap-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: ${{ matrix.triple }}

      # Only the entrypoint. The Stage step builds the rest of the package's
      # binaries, because it is the thing that knows what a package contains.
      # (`CARGO_PROFILE_RELEASE_DEBUG` is set on the job so both agree.)
      - name: Build
        working-directory: codex-rs
        run: cargo build --release --bin codexr --target ${{ matrix.triple }}

      # A Codex package is more than the entrypoint. `codex-code-mode-host` sits
      # beside it in `bin/`, and `codex-resources/` and `codex-path/` hold the
      # bundled bwrap, the patched zsh, and ripgrep. Shipping only `bin/codexr`
      # is what 0.147.0-rewind.1 did, and it left code mode unavailable and
      # `codexr doctor` reporting that ripgrep could not be found.
      #
      # `scripts/build_codex_package.py` is upstream's own builder for that
      # layout: it source-builds the helper binaries, fetches ripgrep and zsh
      # through the verified DotSlash manifests in `scripts/codex_package/`,
      # and writes the `codex-package.json` that `codex-rs/install-context`
      # requires before it will look in `codex-resources/` or `codex-path/` at
      # all. Copying those directories without that file would ship dead
      # weight. Using the builder rather than hand-copying here is also what
      # keeps this workflow correct when upstream adds a new package artifact.
      #
      # The package root doubles as the npm vendor layout: `vendor/<triple>/`
      # with the entrypoint at `bin/codexr` is where `bin/codex.js` looks, and
      # `build_npm_package.py` copies each `vendor/<triple>` tree through
      # verbatim.
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.triple }}"
          release_dir="codex-rs/target/$triple/release"

          # Staged out of the Cargo target directory before stripping, because
          # `Swatinem/rust-cache` saves that directory: stripping in place would
          # put a binary into the cache that Cargo still considers fresh.
          mkdir -p staging
          if [[ "${{ matrix.name }}" == win32-* ]]; then
            # Windows keeps its debug info in a separate .pdb, so the .exe is
            # already lean and there is nothing to strip.
            entrypoint="staging/codexr.exe"
            cp "$release_dir/codexr.exe" "$entrypoint"
          else
            entrypoint="staging/codexr"
            cp "$release_dir/codexr" "$entrypoint"
            chmod +x "$entrypoint"

            # The workspace release profile keeps symbols on purpose —
            # `strip = false`, with a comment saying packaging archives the
            # sidecar symbols and strips afterwards. That packaging lived in
            # upstream's release workflows, which this repository does not
            # have, so the stripping has to happen here instead.
            before=$(stat -c%s "$entrypoint" 2>/dev/null || stat -f%z "$entrypoint")
            strip "$entrypoint"
            after=$(stat -c%s "$entrypoint" 2>/dev/null || stat -f%z "$entrypoint")
            echo "stripped codexr: $((before / 1048576)) MB -> $((after / 1048576)) MB"
          fi

          # Same fallback `.github/scripts/build-codex-package-archive.sh`
          # uses: the Windows runners do not always expose `python3`.
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          else
            python_bin="python"
          fi

          "$python_bin" scripts/build_codex_package.py \
            --variant codexr \
            --target "$triple" \
            --cargo-profile release \
            --entrypoint-bin "$entrypoint" \
            --package-dir "vendor/$triple" \
            --force

          # The helpers the builder just compiled carry symbols for the same
          # reason the entrypoint did. ripgrep and zsh arrive prebuilt from
          # their DotSlash manifests, so they are left exactly as verified.
          if [[ "${{ matrix.name }}" != win32-* ]]; then
            for helper in "vendor/$triple/bin/codex-code-mode-host" \
                          "vendor/$triple/codex-resources/bwrap"; do
              [[ -f "$helper" ]] || continue
              before=$(stat -c%s "$helper" 2>/dev/null || stat -f%z "$helper")
              strip "$helper"
              after=$(stat -c%s "$helper" 2>/dev/null || stat -f%z "$helper")
              echo "stripped $(basename "$helper"): $((before / 1048576)) MB -> $((after / 1048576)) MB"
            done
          fi

          echo "package contents:"
          find "vendor/$triple" -type f | sort

          tar -czf "codexr-$triple.tar.gz" -C vendor "$triple"
          echo "tarball: $(du -h "codexr-$triple.tar.gz" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: codexr-${{ matrix.triple }}
          path: codexr-${{ matrix.triple }}.tar.gz
          retention-days: 14

      - name: Attach to release
        if: needs.plan.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release_tag }}
          TRIPLE: ${{ matrix.triple }}
        shell: bash
        run: |
          # Created as a draft either way, so a matrix that fails halfway never
          # looks like a finished release. On a manual run the draft also keeps
          # the tag off the repository until you publish, which means a
          # `-rewind.<n>` tag only ever names something that was really built.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes "Built by the build workflow."
          gh release upload "$TAG" "codexr-$TRIPLE.tar.gz" --clobber

