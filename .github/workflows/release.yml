name: release

# Pushing a release tag builds all six platforms and publishes them to npm.
#
# The split from `build.yml` is the safety property, not tidiness. Verifying a
# change by hand goes through `build.yml`, which has no path to npm at all — so
# a build you started to answer "does this compile" can never become a release.
# Tagging is the separate, deliberate act that says publish this.
#
# An npm version cannot be replaced once it exists. Push the tag when you mean
# it, and rehearse with `dry_run` first if you are unsure.
#
# There is no npm token here. The registry authenticates this workflow through
# OIDC — the trusted publisher registered against the `codex-rewind` package
# names this repository and this filename, so only this file, in this
# repository, can publish. Renaming it revokes that.

on:
  push:
    tags:
      # Narrow on purpose: an unrelated tag should not start a six-platform
      # matrix and put something on npm.
      - "v*-rewind.*"

  # Rehearsal, and the manual escape hatch if a tag build failed partway.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.147.0-rewind.0"
        required: true
      dry_run:
        description: "Pack and validate against the registry without uploading."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      targets: all
      release_tag: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      # npm trusted publishing: the registry authenticates this job by the OIDC
      # token GitHub mints for it, so there is no npm token in this repository.
      # The trusted publisher registered on npmjs.com names this workflow file by
      # name — moving the publish step into another workflow breaks the claim.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Deliberately no `registry-url`. It writes an .npmrc line reading
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token set that resolves to
      # an empty credential which npm sends and the registry rejects — instead
      # of npm noticing the OIDC environment and using it. registry.npmjs.org is
      # the default anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node 22 ships npm 10.x; trusted publishing needs 11.5.1 or later.
      #
      # Pinned to a major rather than `@latest`, which floats: it picked up npm
      # 12 the first time this ran, and npm 12 changed `npm pack --json` from a
      # list to an object keyed by package name. The packaging script reads both
      # now, but a release should not be the thing that discovers what the npm
      # registry published this morning.
      - name: Upgrade npm
        run: npm install -g "npm@^11.5.1"

      # A reusable workflow shares the calling run's artifact scope, so these
      # are the tarballs the build job just uploaded.
      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rebuild the vendor tree
        shell: bash
        run: |
          mkdir -p vendor
          find artifacts -name '*.tar.gz' -exec tar -xzf {} -C vendor \;
          echo "vendor tree:"
          find vendor -type f | sort

      - name: Publish
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG#v}"
          if [[ -z "$version" ]]; then
            echo "::error::could not derive a version from tag '$TAG'" >&2
            exit 1
          fi

          npm --version  # must be >= 11.5.1 for trusted publishing

          publish() {  # <tarball> [dist-tag]
            local tarball="$1" tag="${2:-}"
            if [[ "$DRY_RUN" == "true" ]]; then
              npm publish "$tarball" --dry-run ${tag:+--tag "$tag"}
            else
              npm publish "$tarball" ${tag:+--tag "$tag"}
            fi
          }

          # All seven of these are the *same* npm package name, separated by a
          # version suffix. The six platform builds are kept off `latest`,
          # because `latest` is what a bare `npm install` follows — point it at
          # one platform and every other platform installs a package with no
          # binary it can run.
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            python3 codex-cli/scripts/build_npm_package.py \
              --package "codex-$pkg" --version "$version" \
              --vendor-src vendor --pack-output "/tmp/$pkg.tgz"
            publish "/tmp/$pkg.tgz" "$pkg"
          done

          # The launcher last, and only once all six resolve: its
          # optionalDependencies name them by exact version.
          #
          # `latest` is spelled out rather than left to default. Every version
          # this workflow publishes is a semver prerelease — `-rewind.<n>` — and
          # npm refuses to publish one without an explicit `--tag`, so omitting
          # it fails here, at the seventh of seven publishes, with the six
          # platform packages already public and the version already spent.
          python3 codex-cli/scripts/build_npm_package.py \
            --package codex --version "$version" --pack-output /tmp/launcher.tgz
          publish /tmp/launcher.tgz latest

          echo "published $version" >> "$GITHUB_STEP_SUMMARY"
